[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cfcnet"
version = "1.0.0"
description = "Gating vs non-gating recurrent networks (CfC, LTC, LSTM, GRU) for one-step-ahead equity-index forecasting"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.urls]
Repository = "https://github.com/rishovnag/cfcnet"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfcnet = ["fonts/*.ttf", "fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
